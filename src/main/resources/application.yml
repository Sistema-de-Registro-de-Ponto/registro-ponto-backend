spring:
  application:
    name: registro-ponto-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3370}/${DB_NAME:registro_ponto}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Schema existente antes da adoção do Flyway

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  time:
    zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  seed:
    collaborator-demo:
      enabled: ${APP_SEED_COLLABORATOR_DEMO:false}
      default-password: ${APP_SEED_COLLABORATOR_DEMO_PASSWORD:12345678}
      collaborators:
        - username: ${APP_SEED_COLLABORATOR_DEMO_USERNAME:demo}
          first-name: ${APP_SEED_COLLABORATOR_DEMO_FIRST_NAME:Demo}
          anchor-date: ${APP_SEED_COLLABORATOR_DEMO_ANCHOR_DATE:2026-05-16}
          journey-count: ${APP_SEED_COLLABORATOR_DEMO_JOURNEY_COUNT:60}
  security:
    jwt:
      secret: ${JWT_SECRET:troque-este-segredo-em-producao-precisa-de-pelo-menos-256-bits-para-HS256}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    rpa:
      api-key: ${RPA_API_KEY:registro_ponto_api_key}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
